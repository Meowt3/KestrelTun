name: Build KestrelTun Release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'README_RU.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download mihomo cores (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64

          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-arm64-v8-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/arm64-v8a/libmihomo.so
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-armv7-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/armeabi-v7a/libmihomo.so
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-amd64-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/x86_64/libmihomo.so

          chmod +x app/src/main/jniLibs/*/libmihomo.so
          ls -lh app/src/main/jniLibs/*/*

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/keystore.jks \
            -storepass kestreltun2026 \
            -keypass kestreltun2026 \
            -alias kestreltun \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=KestrelTun, OU=Android, O=KestrelTun, L=Global, ST=Global, C=US"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Signed Release APKs (Multi-ABI + Universal)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk dist/KestrelTun-v1.2.0-universal-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/KestrelTun-v1.2.0-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/KestrelTun-v1.2.0-armeabi-v7a-release.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk dist/KestrelTun-v1.2.0-x86_64-release.apk
          ls -lh dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KestrelTun-v1.2.0-release-apks
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: KestrelTun v1.2.0 (Material 3 Expressive + Pastel Themes)
          body: |
            ### What's New in KestrelTun v1.2.0
            - **Material 3 Expressive Redesign**: Generous 24–28 dp rounded cards, morphing Connect button (circle ↔ squircle with spring animation), smooth tab transitions, and animated accordions.
            - **Soft Neutral Gray Dark Theme + 9 Pastel Color Palettes**: Lighter, eye-friendly charcoal surfaces (`#14161A` / `#1D2026`) with minimal pastel accents (Material You, Sky, Mint, Aqua, Lavender, Peach, Rose, Cream, Mist), plus true-black **AMOLED** mode compatible with every palette.
            - **Unified Accent Styling**: Connect button, primary actions, toggles, and all ping latency indicators follow the active pastel accent color.
            - **Streamlined Network & Tabbed Settings**: **Network** now focuses strictly on Subscriptions (with a clean link-only Add sheet) and Wi-Fi proxy sharing; **Settings** is cleanly organized into 4 animated sub-tabs (**Routes / Apps / Auto / Theme**).
            - **Multi-ABI + Universal APKs**: Signed R8 Release builds for `arm64-v8a`, `armeabi-v7a`, `x86_64`, and `universal`.

            ### Что нового в KestrelTun v1.2.0
            - **Дизайн Material 3 Expressive и плавные анимации**: увеличенные скругления карточек (24–28 dp), пружинный морфинг кнопки подключения (круг ↔ сквиркл), плавные переходы вкладок и мягкое раскрытие блоков.
            - **Мягкая серо-графитовая тема + 9 пастельных гамм**: комфортные нейтрально-серые поверхности (`#14161A` / `#1D2026`) и 9 деликатных пастельных оттенков (плюс чистый **AMOLED** поверх любой палитры) в виде лаконичных цветных кружков.
            - **Единый акцентный цвет**: кнопка подключения, основные действия и все значения пинга окрашиваются в выбранную пастельную гамму.
            - **Упрощённая вкладка «Сеть» и «Настройки» по вкладкам**: в «Сети» остались только профили подписок (с чистым окном добавления строго по ссылке) и раздача по Wi-Fi; все остальные параметры разнесены по 4 вкладкам в «Настройках» (**Маршруты / Прил. / Авто / Тема**).
            - **Сборки под все архитектуры**: `arm64-v8a`, `armeabi-v7a`, `x86_64` и `universal`.
          files: |
            dist/KestrelTun-v1.2.0-universal-release.apk
            dist/KestrelTun-v1.2.0-arm64-v8a-release.apk
            dist/KestrelTun-v1.2.0-armeabi-v7a-release.apk
            dist/KestrelTun-v1.2.0-x86_64-release.apk
