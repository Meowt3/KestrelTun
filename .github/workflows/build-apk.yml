name: Build KestrelTun Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download mihomo core (arm64-v8a v1.19.34)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fsSL -o /tmp/mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-arm64-v8-v1.19.34.gz"
          gunzip -c /tmp/mihomo.gz > app/src/main/jniLibs/arm64-v8a/libmihomo.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libmihomo.so
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/keystore.jks \
            -storepass kestreltun2026 \
            -keypass kestreltun2026 \
            -alias kestreltun \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=KestrelTun, OU=Android, O=KestrelTun, L=Global, ST=Global, C=US"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK (R8 Optimized)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk KestrelTun-v1.0.0-arm64-release.apk
          ls -lh KestrelTun-v1.0.0-arm64-release.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KestrelTun-v1.0.0-arm64-release
          path: KestrelTun-v1.0.0-arm64-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: KestrelTun v1.0.0 (arm64-v8a Release)
          body: |
            ### KestrelTun v1.0.0 — Native Android VPN Client (Mihomo + Full TUN)
            - **Release APK (`arm64-v8a`)**: R8-optimized native Kotlin + Jetpack Compose Material You client
            - **Core**: Embedded **mihomo v1.19.34** + **hev-socks5-tunnel v2.20.0** Full TUN
            - **Protocols**: VLESS Reality, Hysteria2, TUIC, WireGuard, Trojan, VMess, Shadowsocks, SOCKS5, HTTP
            - **Auto-Tunneling**: Fast native Go batch ping and automatic best-server switching with custom timers
            - **Smart Split Tunneling**: One-tap regional app bypass plus manual per-app include/exclude lists
            - **Routing**: Built-in AdBlock, regional bypass, custom domains, and automatic Wi-Fi / mobile reconnect
          files: KestrelTun-v1.0.0-arm64-release.apk
