name: Build KestrelTun Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download mihomo cores (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64

          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-arm64-v8-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/arm64-v8a/libmihomo.so
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-armv7-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/armeabi-v7a/libmihomo.so
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-amd64-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/x86_64/libmihomo.so

          chmod +x app/src/main/jniLibs/*/libmihomo.so
          ls -lh app/src/main/jniLibs/*/*

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/keystore.jks \
            -storepass kestreltun2026 \
            -keypass kestreltun2026 \
            -alias kestreltun \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=KestrelTun, OU=Android, O=KestrelTun, L=Global, ST=Global, C=US"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APKs (Multi-ABI + Universal)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk dist/KestrelTun-v1.0.0-universal-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/KestrelTun-v1.0.0-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/KestrelTun-v1.0.0-armeabi-v7a-release.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk dist/KestrelTun-v1.0.0-x86_64-release.apk
          ls -lh dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KestrelTun-v1.0.0-release-apks
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: KestrelTun v1.0.0 (Android Multi-ABI + Universal)
          body: |
            ### KestrelTun v1.0.0 — Native Android VPN Client (Mihomo + Full TUN)
            - **Multi-ABI + Universal Release APKs**: `arm64-v8a`, `armeabi-v7a`, `x86_64`, and `universal` (R8-optimized)
            - **Adaptive Icon**: Full Material You & One UI themed / glass icon support (`monochrome` layer included)
            - **Core**: Embedded **mihomo v1.19.34** + **hev-socks5-tunnel v2.20.0** Full TUN
            - **Protocols**: VLESS Reality, Hysteria2, TUIC, WireGuard, Trojan, VMess, Shadowsocks, SOCKS5, HTTP
            - **Auto-Tunneling**: Fast native Go batch ping and automatic best-server switching with custom timers
            - **Smart Split Tunneling**: One-tap regional app bypass plus manual per-app include/exclude lists
            - **Routing**: Built-in AdBlock, regional bypass, custom domains, and automatic Wi-Fi / mobile reconnect
          files: |
            dist/KestrelTun-v1.0.0-universal-release.apk
            dist/KestrelTun-v1.0.0-arm64-v8a-release.apk
            dist/KestrelTun-v1.0.0-armeabi-v7a-release.apk
            dist/KestrelTun-v1.0.0-x86_64-release.apk
