name: Build KestrelTun Release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'README_RU.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download mihomo cores (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64

          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-arm64-v8-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/arm64-v8a/libmihomo.so
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-armv7-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/armeabi-v7a/libmihomo.so
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-amd64-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/x86_64/libmihomo.so

          chmod +x app/src/main/jniLibs/*/libmihomo.so
          ls -lh app/src/main/jniLibs/*/*

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/keystore.jks \
            -storepass kestreltun2026 \
            -keypass kestreltun2026 \
            -alias kestreltun \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=KestrelTun, OU=Android, O=KestrelTun, L=Global, ST=Global, C=US"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Signed Release APKs (Multi-ABI + Universal)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk dist/KestrelTun-v1.2.1-universal-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/KestrelTun-v1.2.1-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/KestrelTun-v1.2.1-armeabi-v7a-release.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk dist/KestrelTun-v1.2.1-x86_64-release.apk
          ls -lh dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KestrelTun-v1.2.1-release-apks
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: KestrelTun v1.2.1 (Smart Auto-Recovery + Battery Optimizations)
          body: |
            ### What's New in KestrelTun v1.2.1
            - **Smart Drop Detection (Zero-Traffic Watchdog)**: In Auto-Tunneling mode, passively monitors OS traffic counters while the screen is on — sleeps when idle or downloading normally, and triggers a 3-strike confirmation check only when outgoing requests receive no response.
            - **Verified Recovery with Top-3 Fallback**: After an auto-test, verifies the newly selected node (1.5s settle + live check) and falls back through top-3 fresh candidates before running at most 2 bounded rescans with exponential backoff (10s → 25s), underlying Wi-Fi/mobile network validation, and a 2-minute anti-loop cooldown.
            - **Network Switch & Outage Recovery**: Ignores micro-drops under 5 seconds; on real outages or Wi-Fi ↔ LTE/5G switches, waits 3s for routes/DNS, clears stale sockets, and verifies the active node before rescanning.
            - **Safe Battery & Memory Optimizations**: Balanced Mihomo `keep-alive` (`60s / 30s`, keeping background push notifications instant while waking the radio 4× less), shared `OkHttpClient` connection pool, idle canvas skip on the speed graph, and lazy log-list allocations.

            ### Что нового в KestrelTun v1.2.1
            - **Умная автопроверка при обрыве (Watchdog)**: в режиме Автотуннелинга пассивно отслеживает системные счётчики трафика при включённом экране — спит в простое и при нормальной загрузке, а при зависании запускает подтверждение из 3 проверок подряд, отсекая микролаги.
            - **Пост-проверка восстановления и фоллбек по топ-3**: после авто-теста проверяет выбранный сервер (1.5 сек + контрольный запрос) и при необходимости перебирает топ-3 свежих кандидатов без лишнего полного перескана; максимум 2 повторных теста с нарастающей паузой (10с → 25с), проверкой мобильной сети/Wi-Fi и паузой 2 мин от зацикливания.
            - **Реакция на смену и восстановление сети**: игнорирует микропадения короче 5 секунд; при переключении Wi-Fi ↔ LTE/5G или возврате сети ждёт 3 сек, сбрасывает зависшие сокеты и проверяет текущий узел.
            - **Безопасные оптимизации батареи и памяти**: сбалансированный `keep-alive` в Mihomo (`60 / 30` сек — push-уведомления в фоне работают мгновенно, а модем будится в 4 раза реже), общий пул `OkHttpClient`, пропуск пустых перерисовок графика скорости и ленивое обновление списка логов.
          files: |
            dist/KestrelTun-v1.2.1-universal-release.apk
            dist/KestrelTun-v1.2.1-arm64-v8a-release.apk
            dist/KestrelTun-v1.2.1-armeabi-v7a-release.apk
            dist/KestrelTun-v1.2.1-x86_64-release.apk
