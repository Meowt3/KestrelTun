name: Build KestrelTun Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download mihomo cores (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64

          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-arm64-v8-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/arm64-v8a/libmihomo.so
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-armv7-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/armeabi-v7a/libmihomo.so
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-amd64-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/x86_64/libmihomo.so

          chmod +x app/src/main/jniLibs/*/libmihomo.so
          ls -lh app/src/main/jniLibs/*/*

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/keystore.jks \
            -storepass kestreltun2026 \
            -keypass kestreltun2026 \
            -alias kestreltun \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=KestrelTun, OU=Android, O=KestrelTun, L=Global, ST=Global, C=US"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Signed Release APKs (Multi-ABI + Universal)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk dist/KestrelTun-v1.1.0-universal-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/KestrelTun-v1.1.0-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/KestrelTun-v1.1.0-armeabi-v7a-release.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk dist/KestrelTun-v1.1.0-x86_64-release.apk
          ls -lh dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KestrelTun-v1.1.0-release-apks
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: KestrelTun v1.1.0 (Android Multi-ABI + Universal)
          body: |
            ### What's New in KestrelTun v1.1.0
            - **Faster & More Accurate Ping**: 64 concurrent slots with 3000 ms timeout, smart priority queue (previously working servers tested first), and unified latency sync across all proxy groups.
            - **Fixed Live Sorting & Auto-Scroll**: Properly respects live-sort settings and keeps the proxy grid pinned to the top during and after ping tests.
            - **Redesigned Network & Settings UI**: Moved subscription management and quick link/clipboard/key import to the top of the **Network** tab, clarified routing rules, added Wi-Fi proxy address copy, and pinned selected Split Tunneling apps to the top.
            - **AMOLED Theme Mode & 9 Visual Color Palettes**: Moved **AMOLED** into **Theme Mode** so pure black combines with any accent color, and added 9 visual color swatch icons (Material You, Ocean, Emerald, Teal, Violet, Crimson, Amber, Rose, Monochrome).
            - **Samsung Modes & Routines (Background Toggle)**: Added a single silent **Toggle** app action (`Theme.NoDisplay` + isolated task) so routines switch VPN ON/OFF in the background without minimizing the active app.
            - **Multi-ABI + Universal APKs**: Signed R8 Release builds for `arm64-v8a`, `armeabi-v7a`, `x86_64`, and `universal`.

            ### Что нового в KestrelTun v1.1.0
            - **Быстрый и точный пинг**: 64 параллельных слота, таймаут 3000 мс, умная очередь (прошлые рабочие серверы проверяются первыми за ~0.5–1 с) и единый синхронизированный пинг между всеми группами.
            - **Исправлены живая сортировка и автоскролл**: список серверов больше не улетает в середину во время и после проверки задержки, а чётко возвращается к верхним строкам.
            - **Обновлённые вкладки «Сеть» и «Настройки»**: управление и добавление подписок (по ссылке, из буфера или ключом/YAML) вынесены наверх вкладки «Сеть», переработаны описания правил, добавлено копирование адреса раздачи по Wi-Fi, а выбранные приложения в Split Tunneling закрепляются сверху.
            - **Режим AMOLED и 9 визуальных цветовых гамм**: **AMOLED** перенесён в режим темы и теперь работает с любым цветом акцента; добавлены 9 наглядных цветных иконок палитр.
            - **Сценарии Samsung (фоновое переключение)**: добавлено единое действие **«Переключение»** (вкл/выкл в фоне через невидимую `QuickActionActivity` без сворачивания текущего приложения).
            - **Сборки под все архитектуры**: `arm64-v8a`, `armeabi-v7a`, `x86_64` и `universal`.
          files: |
            dist/KestrelTun-v1.1.0-universal-release.apk
            dist/KestrelTun-v1.1.0-arm64-v8a-release.apk
            dist/KestrelTun-v1.1.0-armeabi-v7a-release.apk
            dist/KestrelTun-v1.1.0-x86_64-release.apk
