name: Build KestrelTun Release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'README_RU.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download mihomo cores (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64

          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-arm64-v8-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/arm64-v8a/libmihomo.so
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-armv7-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/armeabi-v7a/libmihomo.so
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-android-amd64-v1.19.34.gz" \
            | gunzip > app/src/main/jniLibs/x86_64/libmihomo.so

          chmod +x app/src/main/jniLibs/*/libmihomo.so
          ls -lh app/src/main/jniLibs/*/*

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/keystore.jks \
            -storepass kestreltun2026 \
            -keypass kestreltun2026 \
            -alias kestreltun \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=KestrelTun, OU=Android, O=KestrelTun, L=Global, ST=Global, C=US"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Signed Release APKs (Multi-ABI + Universal)
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-universal-release.apk dist/KestrelTun-v1.2.2-universal-release.apk
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist/KestrelTun-v1.2.2-arm64-v8a-release.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk dist/KestrelTun-v1.2.2-armeabi-v7a-release.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk dist/KestrelTun-v1.2.2-x86_64-release.apk
          ls -lh dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KestrelTun-v1.2.2-release-apks
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: KestrelTun v1.2.2 (Reliable Auto-Recovery Watchdog)
          body: |
            ### What's New in KestrelTun v1.2.2
            - **Reactive Core-Log Drop Detector (Works with RU Bypass)**: Listens directly to `mihomo` proxy dial errors (`>= 3` real `dial PROXY` failures within 15s, strictly ignoring `DIRECT` traffic and `context canceled`) with zero extra traffic or radio wakeups.
            - **Fixed Mobile LTE Recovery Blocking**: Removed overly strict `NET_CAPABILITY_VALIDATED` gate that silently blocked auto-recovery on cellular networks where captive-portal validation is unavailable; added immediate 2-minute cooldown when 0 servers respond to protect battery during real offline periods.
            - **Anti-False-Positive Guards**: Added a 6s post-switch grace period (ignoring trailing timeouts from the previous node), a 45s healthy-check cooldown (preventing repeated pings on single dead hosts or long uploads), and effective-transport tracking to stop Wi-Fi + LTE flapping when Mobile Data Always Active is enabled.
            - **Enhanced Diagnostic Header**: Diagnostic logs now include Auto-Tunneling state, `RecoverOnDrop` flag, and current watchdog status.

            ### Что нового в KestrelTun v1.2.2
            - **Реактивный детектор обрывов по логам ядра (работает с RU Bypass)**: отслеживает реальные ошибки `dial PROXY` в потоке `mihomo` (≥ 3 ошибки за 15 сек, игнорируя `DIRECT` и `context canceled`) — срабатывает даже при активном прямом трафике и не тратит батарею.
            - **Исправлено восстановление в мобильных сетях LTE**: снята жёсткая привязка к системному флагу `NET_CAPABILITY_VALIDATED`, который молча блокировал автопроверку на вышках без Google-валидации; при полном отсутствии интернета (0 ответивших серверов) сразу включается 2-минутная пауза без лишних повторов.
            - **Защита от ложных срабатываний**: пауза 6 сек после переключения узла («хвост» старых ошибок), cooldown 45 сек после подтверждения живого узла (один недоступный сайт или аплоад не дёргают пинг) и определение эффективного транспорта без ложных обрывов при одновременно активных Wi-Fi и LTE.
            - **Расширенный диагностический лог**: в шапку лога добавлены статус Автотуннелинга, состояние автопроверки при обрыве и текущий статус планировщика.
          files: |
            dist/KestrelTun-v1.2.2-universal-release.apk
            dist/KestrelTun-v1.2.2-arm64-v8a-release.apk
            dist/KestrelTun-v1.2.2-armeabi-v7a-release.apk
            dist/KestrelTun-v1.2.2-x86_64-release.apk
